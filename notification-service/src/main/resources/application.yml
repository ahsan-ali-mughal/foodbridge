spring:
  application:
    name: notification-service

  data:
    mongodb:
      uri: mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DB:foodbridge_notifications}

  quartz-datasource:
    url: jdbc:mysql://${QUARTZ_DB_HOST:localhost}:${QUARTZ_DB_PORT:3306}/${QUARTZ_DB_NAME:foodbridge_notification_quartz}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${QUARTZ_DB_USERNAME:foodbridge}
    password: ${QUARTZ_DB_PASSWORD:foodbridge}
    driver-class-name: com.mysql.cj.jdbc.Driver

  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: always
    properties:
      org:
        quartz:
          scheduler:
            instanceName: NotificationServiceScheduler
            instanceId: AUTO
          jobStore:
            isClustered: true
            clusterCheckinInterval: 10000
            driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
            useProperties: false
          threadPool:
            threadCount: 5

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      properties:
        spring.json.trusted.packages: com.foodbridge.common.event

server:
  port: ${SERVER_PORT:8086}
  shutdown: graceful

aws:
  region: ${AWS_REGION:us-east-1}
  endpoint-override: ${AWS_ENDPOINT_OVERRIDE:http://localhost:4566}
  sns:
    urgent-alerts-topic-arn: ${URGENT_ALERTS_TOPIC_ARN:arn:aws:sns:us-east-1:000000000000:urgent-alerts-topic}
  sqs:
    notification-job-queue-url: ${NOTIFICATION_JOB_QUEUE_URL:http://localhost:4566/000000000000/notification-job-queue}

notification:
  job-poller:
    fixed-delay-ms: ${JOB_POLLER_DELAY_MS:5000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.foodbridge: DEBUG
